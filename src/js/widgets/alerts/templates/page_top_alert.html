{{#if msg}}
<div class="alert alert-{{type}}" id="page-top-alert" role="{{role}}" aria-live="{{ariaLive}}">
  <div>
    {{{msg}}}
  </div>
  {{#if dismissable}}
  <div>
    <button type="button" class="close">
      <span aria-hidden="true"
        ><i class="fa fa-times" aria-hidden="true"></i></span
      ><span class="sr-only">Close</span>
    </button>
  </div>
  {{/if}}
</div>
{{/if}}
